[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explorenet"
version = "0.1.0"
description = "ExploreNet: learning where to explore in diffusion GRPO (Flow-GRPO + a learned noise policy for SD3.5)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "diffusers==0.33.1",
    "transformers==4.45.2",
    "accelerate==1.4.0",
    "peft==0.10.0",
    "numpy==1.26.4",
    "pillow==10.4.0",
    "requests==2.32.3",
    "wandb==0.18.7",
    "ml-collections==1.1.0",
    "absl-py==2.5.0",
    "sentencepiece==0.2.2",
    "protobuf==3.20.3",
    "tqdm==4.67.1",
    "huggingface-hub==0.29.1",
]

[tool.setuptools.packages.find]
include = ["explorenet*"]
